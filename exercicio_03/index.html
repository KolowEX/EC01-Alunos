<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EC01 - Alunos - Exercício 3</title>
  <!-- Página sem CSS: foco em HTML, DOM e JavaScript. -->
  <script src="app.js" defer></script>
</head>
<body>
  <p><a href="../index.html">Voltar para EC01 - Alunos</a></p>
  <h1>EC01 - Alunos - Exercício 3</h1>
  <p>addEventListener, funções anônimas, arrow functions e mensagens das operações.</p>
  <h2>Cadastro</h2>
  <form id="form-registro">
      <p><label for="nome">Nome:</label> <input id="nome" name="nome" type="text" required maxlength="100"></p>
      <p><label for="idade">Idade:</label> <input id="idade" name="idade" type="number" min="1" max="120" step="1" required></p>
      <p><label for="curso">Curso:</label> <select id="curso" name="curso" required><option>JavaScript</option><option>Python</option><option>Java</option></select></p>
      <p><label for="notaFinal">Nota Final:</label> <input id="notaFinal" name="notaFinal" type="number" min="0" max="10" step="0.1" required></p>
      <button type="submit" id="btn-salvar">Cadastrar</button>
      <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
  </form>
      <p id="mensagem" role="status"></p>
  <h2>Lista de alunos</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
          <th scope="col">ID</th>
          <th scope="col">Nome</th>
          <th scope="col">Idade</th>
          <th scope="col">Curso</th>
          <th scope="col">Nota Final</th>
          <th scope="col">Situação</th>
          <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-registros"></tbody>
  </table>

</body>
</html>
